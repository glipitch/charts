name: Fetch TradingView data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-tv-data.yaml
      - back/fetch-tv-data.js
      - back/launch-locally.js
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-tv-data
  cancel-in-progress: false

jobs:
  fetch-tv-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch available markets
        run: node back/launch-locally.js

      - name: Commit updated data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update available markets data
          file_pattern: front/available-markets/data.json

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changes_detected == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: front
          branch: gh-pages
