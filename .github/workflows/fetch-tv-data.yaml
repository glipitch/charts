name: Fetch TradingView data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-tv-data.yaml
      - back/fetch-tv-data.js
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-tv-data
  cancel-in-progress: false

jobs:
  fetch-tv-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch available markets
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const script = require('./back/fetch-tv-data.js');
            await script({ fetch: globalThis.fetch });

      - name: Commit updated data
        id: commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          data_file=front/available-markets/data.json
          generated_data=$(mktemp)
          trap 'rm -f "$generated_data"' EXIT
          cp "$data_file" "$generated_data"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in {1..5}; do
            # The branch may have moved during the fetch. Keep the generated
            # data and apply it to the latest code before each push attempt.
            git fetch origin "refs/heads/$TARGET_BRANCH"
            git reset --hard FETCH_HEAD
            cp "$generated_data" "$data_file"
            git add -- "$data_file"

            if git diff --cached --quiet; then
              echo 'changes_detected=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m 'Update available markets data'
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo 'changes_detected=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Push attempt $attempt failed; refreshing the branch before retrying."
              sleep 10
            fi
          done

          echo '::error::Could not push updated markets data after 5 attempts.'
          exit 1
