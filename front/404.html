<!DOCTYPE html>
<html lang="en">

<head>
  <base href="/charts/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Charts in a grid" />
  <link rel="canonical" href="https://glipitch.github.io/charts/" />
  <script>
    document.documentElement.dataset.theme = localStorage.theme === "light" ? "light" : "dark";
  </script>
  <!-- <link rel="icon" type="image/svg+xml" href="icon.svg" /> -->


  <link rel="shortcut icon" href="favicon.ico">

  <title>Charts</title>
  <link href="css/app.css" rel="stylesheet" />
</head>

<body>
  <dialog id="settings" aria-label="Settings" tabindex="-1">
    <div class="dialog-content">
      <div class="settings">
        <div class="grid-settings">
          <div class="dimensions-container">
            <label for="x">Columns</label>
            <div class="dimensions">
              <button class="minus" aria-label="Fewer columns">−</button>
              <input id="x" type="number" min="1" step="1" max="20" />
              <button class="plus" aria-label="More columns">+</button>
            </div>
          </div>
          <div class="dimensions-container">
            <label for="y">Rows</label>
            <div class="dimensions">
              <button class="minus" aria-label="Fewer rows">−</button>
              <input id="y" type="number" min="1" step="1" max="20" />
              <button class="plus" aria-label="More rows">+</button>
            </div>
          </div>
        </div>
        <div class="opacity-container">
          <div class="opacity-row">
            <label for="opacity-input">Opacity</label>
            <input type="range" id="opacity-input" min="0.80" max="1.00" step=".05" list="markers" />
            <span></span>
          </div>
          <div class="opacity-hint">fade this panel to see charts beneath</div>
          <datalist id="markers">
          </datalist>
        </div>
      </div>
      <div class="divider"></div>
      <div class="current-header">
        <h4>Current</h4>
        <span class="market-count"></span>
      </div>
      <div class="table-scroll current-scroll">
      <table class="current" aria-label="Current charts">
        <thead><tr>
          <th>Exchange</th>
          <th>Symbol</th>
          <th>Interval</th>
          <th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      </div>
      <p class="empty-state">click an available market to add it</p>
      <button class="clear">Clear</button>
      <div class="divider"></div>
      <h4>Available</h4>
      <input id="search" type="search" class="search" aria-label="Search markets" placeholder="e.g. btc binance" spellcheck="false" autocomplete="off" />
      <p class="search-status sr-only" role="status"></p>
      <div class="table-scroll available-scroll">
      <table class="available" aria-label="Available markets">
        <thead><tr>
          <th>Exchange</th>
          <th>Symbol</th>
        </tr></thead>
        <tbody><tr>
          <td>loading...</td>
        </tr></tbody>
      </table>
      </div>
    </div>
  </dialog>
  <header>
    <button class="dialog-visibility" aria-label="Toggle settings" aria-controls="settings" aria-expanded="false">
      <svg viewBox="0 0 20 20"></svg>
    </button>
    <button class="theme" aria-label="Theme">
      <svg viewBox="0 0 24 24"></svg>
    </button>
    <a class="github" href="https://github.com/glipitch/charts" aria-label="Charts on GitHub">
      <svg viewBox="0 0 24 24">
      </svg>
    </a>
  </header>
  <main>
  </main>
  <script type="module" src="app.mjs"></script>
</body>

</html>
